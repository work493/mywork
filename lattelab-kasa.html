<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LatteLab — Kasa Paneli</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kasa-style.css">
</head>
<body>

<header>
  <div class="header-left">
    <span class="logo">LatteLab</span>
    <span class="subtitle">Kasa Paneli</span>
  </div>
  <div class="header-right">
    <div class="status-dot" id="status-dot"></div>
    <span class="status-text" id="status-text">Bağlanıyor...</span>
    <div class="stats">
      <div class="stat-item">
        <span class="stat-num" id="stat-bekleyen">0</span>
        <span class="stat-label">Bekleyen</span>
      </div>
      <div class="stat-item">
        <span class="stat-num" id="stat-tamamlanan">0</span>
        <span class="stat-label">Tamamlanan</span>
      </div>
      <div class="stat-item">
        <span class="stat-num" id="stat-ciro">0 ₺</span>
        <span class="stat-label">Günlük Ciro</span>
      </div>
    </div>
    <button class="ses-btn" id="ses-btn" onclick="sesiEtkinlestir()">🔕 Sesi aç</button>
    <button class="clear-btn" onclick="clearCompleted()">Tamamlananları Temizle</button>
  </div>
</header>

<div class="ses-uyari" id="ses-uyari" onclick="sesiEtkinlestir()">
  🔇 Bildirim sesi kapalı — etkinleştirmek için buraya bir kez tıklayın
</div>

<div class="board" id="board">
  <div class="empty-state" id="empty-state">
    <div class="empty-icon">☕</div>
    <p>Henüz sipariş yok</p>
    <span>Müşteriler sipariş verdiğinde burada görünecek</span>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, update, query, orderByChild, equalTo }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// =====================
// FIREBASE AYARLARI
// =====================
const firebaseConfig = {
  apiKey: "AIzaSyALDEl3MN5frBidfX7AZ4op0qGFGlPRZ88",
  authDomain: "nula-coffee.firebaseapp.com",
  databaseURL: "https://nula-coffee-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "nula-coffee",
  storageBucket: "nula-coffee.firebasestorage.app",
  messagingSenderId: "601885483227",
  appId: "1:601885483227:web:dde659834f539be9e02cfe"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// =====================
// DURUM
// =====================
let siparisler = {};
let ilkYukleme = true;

// Bağlantı durumu
const connRef = ref(db, ".info/connected");
onValue(connRef, (snap) => {
  const connected = snap.val();
  const dot = document.getElementById("status-dot");
  const text = document.getElementById("status-text");
  if (connected) {
    dot.className = "status-dot online";
    text.textContent = "Canlı bağlantı aktif";
  } else {
    dot.className = "status-dot offline";
    text.textContent = "Bağlantı kesildi";
  }
});

// Siparişleri dinle
const sipRef = ref(db, "lattelab_siparisler");
onValue(sipRef, (snap) => {
  const data = snap.val() || {};

  // Yeni sipariş var mı kontrol et
  if (!ilkYukleme) {
    const eskiIds = new Set(Object.keys(siparisler));
    const yeniIds = Object.keys(data).filter(k => !eskiIds.has(k));
    if (yeniIds.length > 0) {
      playSound();
      yeniIds.forEach(k => bildirimGoster(k, data[k]));
      if (document.hidden) { okunmamis += yeniIds.length; baslikGuncelle(); }
      showToast(yeniIds.length === 1
        ? `Masa ${data[yeniIds[0]].masa} yeni sipariş verdi!`
        : `${yeniIds.length} yeni sipariş geldi!`);
    }
  }

  siparisler = data;
  ilkYukleme = false;
  renderBoard();
  updateStats();
});

// =====================
// RENDER
// =====================
function renderBoard() {
  const board = document.getElementById("board");
  const empty = document.getElementById("empty-state");
  const ids = Object.keys(siparisler).sort((a, b) => {
    // Bekleyenler önce, sonra zamana göre yeniden eskiye
    const sa = siparisler[a];
    const sb = siparisler[b];
    if (sa.durum !== sb.durum) return sa.durum === "bekliyor" ? -1 : 1;
    return sb.zaman - sa.zaman;
  });

  // Eski kartları kaldır (empty state hariç)
  board.querySelectorAll(".siparis-kart").forEach(el => el.remove());

  if (ids.length === 0) {
    empty.style.display = "flex";
    return;
  }
  empty.style.display = "none";

  ids.forEach(id => {
    const s = siparisler[id];
    const kart = document.createElement("div");
    kart.className = "siparis-kart " + (s.durum === "tamamlandi" ? "tamamlandi" : "bekliyor");
    kart.id = "kart-" + id;

    const zaman = new Date(s.zaman);
    const zamanStr = zaman.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
    const gecen = Math.floor((Date.now() - s.zaman) / 60000);
    const gecenStr = gecen < 1 ? "Az önce" : gecen + " dk önce";

    const urunlerHTML = s.urunler.map(u =>
      `<div class="urun-satir">
        <span class="urun-adi">${u.ad}</span>
        <span class="urun-adet">× ${u.adet}</span>
        <span class="urun-fiyat">${u.fiyat * u.adet} ₺</span>
      </div>`
    ).join("");

    kart.innerHTML = `
      <div class="kart-header">
        <div class="masa-badge">Masa ${s.masa}</div>
        ${s.musteriAdi ? `<div class="musteri-adi">👤 ${s.musteriAdi}</div>` : ""}
        <div class="kart-zaman">
          <span class="zaman-saat">${zamanStr}</span>
          <span class="zaman-gecen">${gecenStr}</span>
        </div>
        ${s.durum === "tamamlandi" ? '<div class="tamamlandi-badge">✓ Tamamlandı</div>' : ""}
      </div>
      <div class="urunler">${urunlerHTML}</div>
      ${s.not ? `<div class="siparis-not">📝 ${s.not}</div>` : ""}
      <div class="kart-footer">
        <span class="toplam">Toplam: <strong>${s.toplam} ₺</strong></span>
        ${s.durum === "bekliyor"
          ? `<button class="tamam-btn" onclick="tamamla('${id}')">✓ Tamamlandı</button>`
          : `<button class="iptal-btn" onclick="geriAl('${id}')">↩ Geri Al</button>`
        }
      </div>
    `;
    board.appendChild(kart);
  });
}

function updateStats() {
  const ids = Object.keys(siparisler);
  const bekleyenler = ids.filter(id => siparisler[id].durum === "bekliyor");
  const tamamlananlar = ids.filter(id => siparisler[id].durum === "tamamlandi");
  const ciro = tamamlananlar.reduce((t, id) => t + (siparisler[id].toplam || 0), 0);

  document.getElementById("stat-bekleyen").textContent = bekleyenler.length;
  document.getElementById("stat-tamamlanan").textContent = tamamlananlar.length;
  document.getElementById("stat-ciro").textContent = ciro + " ₺";
}

// =====================
// AKSİYONLAR
// =====================
window.tamamla = (id) => {
  update(ref(db, "lattelab_siparisler/" + id), { durum: "tamamlandi" });
};

window.geriAl = (id) => {
  update(ref(db, "lattelab_siparisler/" + id), { durum: "bekliyor" });
};

window.clearCompleted = () => {
  const ids = Object.keys(siparisler).filter(id => siparisler[id].durum === "tamamlandi");
  if (ids.length === 0) return;
  if (!confirm(ids.length + " tamamlanan siparişi silmek istiyor musunuz?")) return;
  const updates = {};
  ids.forEach(id => updates["lattelab_siparisler/" + id] = null);
  update(ref(db), updates);
};

// =====================
// SES MOTORU
// =====================
// ÖNEMLİ: AudioContext SADECE BİR KEZ yaratılır. Her seferinde yenisini
// yaratmak tarayıcı limitine (Chrome'da sekme başına ~6) takılıp sesi
// tamamen kesiyordu.
let audioCtx = null;
let sesHazir = false;

function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { audioCtx = new AC(); } catch(e) { return null; }
  }
  return audioCtx;
}

// Tek bir "çan" vuruşu
function beep(freq, gecikme, sure, ses) {
  const ctx = audioCtx;
  if (!ctx || ctx.state !== "running") return;
  const t0 = ctx.currentTime + gecikme;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(ses, t0 + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + sure);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + sure + 0.05);
}

function playSound() {
  const ctx = ensureAudio();
  if (!ctx) return;
  const cal = () => {
    // ding-dong × 2
    [[880, 0.00], [1175, 0.20], [880, 0.45], [1175, 0.65]]
      .forEach(([f, g]) => beep(f, g, 0.35, 0.35));
    sesDurumGuncelle();
  };
  // Tarayıcı arka planda context'i askıya almış olabilir → önce uyandır
  if (ctx.state === "running") cal();
  else ctx.resume().then(cal).catch(() => sesDurumGuncelle());
}

// Sesi ve bildirimleri etkinleştir (kullanıcı hareketi gerektirir)
window.sesiEtkinlestir = async () => {
  const ctx = ensureAudio();
  if (ctx) {
    try { await ctx.resume(); } catch(e) {}
    // Sessiz buffer ile otomatik-oynatma kilidini kır
    try {
      const src = ctx.createBufferSource();
      src.buffer = ctx.createBuffer(1, 1, 22050);
      src.connect(ctx.destination);
      src.start(0);
    } catch(e) {}
    if (ctx.state === "running" && !sesHazir) {
      sesHazir = true;
      beep(1175, 0, 0.15, 0.25); // "açıldı" tonu
    }
  }
  // Masaüstü bildirimi izni
  if ("Notification" in window && Notification.permission === "default") {
    try { await Notification.requestPermission(); } catch(e) {}
  }
  sesDurumGuncelle();
};

// Sayfada herhangi bir yere ilk dokunuş da sesi açsın
["pointerdown", "keydown"].forEach(ev =>
  document.addEventListener(ev, () => {
    if (!sesHazir || (audioCtx && audioCtx.state !== "running")) window.sesiEtkinlestir();
  }, { passive: true })
);

function sesDurumGuncelle() {
  const acik = !!audioCtx && audioCtx.state === "running";
  const btn = document.getElementById("ses-btn");
  const uyari = document.getElementById("ses-uyari");
  const bildirimVar = ("Notification" in window) && Notification.permission === "granted";
  btn.textContent = acik ? (bildirimVar ? "🔔 Ses + bildirim açık" : "🔔 Ses açık") : "🔕 Sesi aç";
  btn.classList.toggle("aktif", acik);
  uyari.classList.toggle("goster", !acik);
}

// =====================
// MASAÜSTÜ BİLDİRİMİ
// =====================
function bildirimGoster(id, s) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try {
    const govde = (s.urunler || []).map(u => `${u.adet}× ${u.ad}`).join(", ");
    const n = new Notification(`🔔 Masa ${s.masa} — yeni sipariş`, {
      body: `${govde}\nToplam: ${s.toplam} ₺` + (s.not ? `\n📝 ${s.not}` : ""),
      tag: "lattelab-" + id,       // her sipariş ayrı bildirim
      requireInteraction: true,     // kapatılana kadar ekranda kalsın
      renotify: false
    });
    n.onclick = () => { window.focus(); n.close(); };
  } catch(e) {}
}

// =====================
// SEKME BAŞLIĞI SAYACI
// =====================
let okunmamis = 0;
const baslikOrj = "LatteLab — Kasa Paneli";
function baslikGuncelle() {
  document.title = okunmamis > 0 ? `(${okunmamis}) 🔔 Yeni sipariş!` : baslikOrj;
}
function okunduIsaretle() {
  if (okunmamis > 0) { okunmamis = 0; baslikGuncelle(); }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) okunduIsaretle(); });
window.addEventListener("focus", okunduIsaretle);

function showToast(msg) {
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.classList.add("show"), 10);
  setTimeout(() => {
    toast.classList.remove("show");
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

// Açılışta ses durumunu kontrol et (bazı tarayıcılar izin verir, çoğu tıklama ister)
ensureAudio();
sesDurumGuncelle();

// Zaman güncelleyici (gecen süreyi canlı tut) + ses durumu denetimi
setInterval(() => { renderBoard(); sesDurumGuncelle(); }, 30000);
</script>
</body>
</html>
